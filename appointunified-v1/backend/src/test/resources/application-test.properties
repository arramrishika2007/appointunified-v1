# ─────────────────────────────────────────────────────────────
# AppointUnified — Test Profile (H2 in-memory)
# ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:au_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

# JWT — test-only secret (NOT for production)
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktbXVzdC1iZS1sb25nLWVub3VnaA==
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=2592000000

# Firebase — stub for tests
app.firebase.credentials={}
app.firebase.project-id=test-project

# Mail — disabled in tests (MailHog would run in integration, stubbed here)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=test@appointunified.com
app.mail.from-name=AppointUnified Test

# Cloudinary — stub
app.cloudinary.url=cloudinary://key:secret@test
app.cloudinary.upload-preset=test_preset
app.cloudinary.max-file-size-mb=2

# CORS
app.cors.allowed-origins=http://localhost:3000

# Frontend URL
app.frontend.url=http://localhost:3000

# Logging — quieter in tests
logging.level.com.appointunified=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
