# AppointUnified V1 — Application Configuration
# Copy this to application.properties and fill in your values

# Load env files when present so local runs pick up values without manual exports.
# Order matters: backend/.env overrides root .env when both are present.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api
spring.application.name=appointunified-backend

# ─── Database (Neon PostgreSQL) ────────────────────────────────────────────────
spring.datasource.url=${NEON_DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Neon cold-start keepalive
spring.datasource.hikari.keepalive-time=240000
spring.datasource.hikari.connection-test-query=SELECT 1

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ─── Flyway Migrations ────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Avoid accidental data.sql/seed.sql initialization.
spring.sql.init.mode=never

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-ms=${JWT_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:2592000000}

# ─── Firebase Admin ───────────────────────────────────────────────────────────
app.firebase.credentials=${FIREBASE_CREDENTIALS}
app.firebase.project-id=${FIREBASE_PROJECT_ID}

# ─── Cache / Redis ────────────────────────────────────────────────────────────
spring.data.redis.url=${REDIS_URL:}

# ─── Mail (SendGrid SMTP) ─────────────────────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:apikey}
spring.mail.password=${SENDGRID_API_KEY}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.from=${MAIL_FROM:noreply@appointunified.com}
app.mail.from-name=${MAIL_FROM_NAME:AppointUnified}

# ─── Cloudinary ───────────────────────────────────────────────────────────────
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:djufauiet}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:appointunified_docs}
app.cloudinary.max-file-size-mb=${CLOUDINARY_MAX_FILE_SIZE_MB:2}

# ─── Frontend URL ────────────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:${APP_BASE_URL:http://localhost:3000}}

# ─── App base URL ────────────────────────────────────────────────────────────
app.base.url=${APP_BASE_URL:http://localhost:8080}

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── OpenAPI ──────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.appointunified=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
