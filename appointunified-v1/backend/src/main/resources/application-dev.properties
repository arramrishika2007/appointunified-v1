# Development Profile Configuration
# Use with: mvn spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=dev"

# Reuse the Neon-backed datasource from application.properties; only tweak local dev behavior here.
spring.jpa.show-sql=true

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080
# Flyway (Allow out-of-order migrations during dev)
spring.flyway.outOfOrder=true
spring.flyway.validateOnMigrate=false


# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.appointunified=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
