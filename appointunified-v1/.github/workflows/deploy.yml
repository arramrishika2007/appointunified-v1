name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ─── Deploy Frontend to Vercel ────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    # Vercel auto-deploys via GitHub integration — no extra steps needed
    # This job documents the deployment and can trigger post-deploy checks
    steps:
      - name: Deployment note
        run: echo "Vercel auto-deploy triggered by push to main"

  # ─── Build & Deploy Backend to Railway ───────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest
    needs: []  # Run in parallel with frontend
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Build Docker image
        run: mvn spring-boot:build-image -DskipTests
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag appointunified-backend:latest ${{ secrets.DOCKER_USERNAME }}/appointunified-backend:latest
          docker tag appointunified-backend:latest ${{ secrets.DOCKER_USERNAME }}/appointunified-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/appointunified-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/appointunified-backend:${{ github.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
